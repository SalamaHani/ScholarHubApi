version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: scholarhub_db
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-scholarhub}
    # DO NOT expose 5432 on production — only the api service needs it via the internal network.
    # Uncomment the next two lines only for local development:
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scholarhub}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholarhub_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Node.js API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: scholarhub_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ports:
        - "8080:8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scholarhub}?schema=public
    volumes:
      - uploads_data:/app/uploads
    # prisma db push syncs the schema without requiring committed migration files.
    # Once you run `prisma migrate dev --name init` locally and commit the migrations/
    # directory, change this to: npx prisma migrate deploy && node dist/index.js
    command: sh -c "npx prisma db push && node dist/seed.js && node dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scholarhub_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: scholarhub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - uploads_data:/app/uploads:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - scholarhub_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:
  nginx_logs:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  scholarhub_net:
    driver: bridge
