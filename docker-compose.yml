version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: scholarhub_db
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-scholarhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scholarhub}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholarhub_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Node.js API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: scholarhub_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scholarhub}?schema=public
    volumes:
      - uploads_data:/app/uploads
    command: sh -c "npx prisma db push && node dist/seed.js && node dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scholarhub_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  scholarhub_net:
    driver: bridge
